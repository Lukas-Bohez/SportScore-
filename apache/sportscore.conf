# Apache site configuration for SportScore
# Adjust ServerName as needed (e.g., sportscore.example.com or localhost)

<VirtualHost *:80>
  ServerName sportscore.local
  ServerAdmin webmaster@localhost
  DocumentRoot /var/www/sportscore

  <Directory /var/www/sportscore>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  # Optional: set a small timeout for static assets
  <IfModule mod_expires.c>
    ExpiresActive On
  </IfModule>

  ErrorLog ${APACHE_LOG_DIR}/sportscore-error.log
  CustomLog ${APACHE_LOG_DIR}/sportscore-access.log combined
</VirtualHost>
