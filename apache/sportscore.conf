# Apache site configuration for SportScore
# Adjust ServerName as needed (e.g., sportscore.example.com or localhost)

<VirtualHost *:80>
  ServerName sportscore.local
  # Allow requests addressed to localhost and known kiosk IPs (useful for Pi Kiosk and local testing)
  ServerAlias localhost 127.0.0.1 192.168.123.241
  ServerAdmin webmaster@localhost
  DocumentRoot /var/www/sportscore

  <Directory /var/www/sportscore>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  # Serve SPA entry as a last-resort fallback for deep links
  ErrorDocument 404 /index.html

  # Optional: set a small timeout for static assets
  <IfModule mod_expires.c>
    ExpiresActive On
  </IfModule>

  ErrorLog ${APACHE_LOG_DIR}/sportscore-error.log
  CustomLog ${APACHE_LOG_DIR}/sportscore-access.log combined
</VirtualHost>
