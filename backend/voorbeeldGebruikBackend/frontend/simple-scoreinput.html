<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Score Invoer</title>
    <link rel="stylesheet" href="css/scoreinput.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        .control-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(108, 117, 125, 0.2);
        }
        .control-btn:hover {
            background: linear-gradient(135deg, #5a6268 0%, #495057 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="homescreen.html" class="control-btn" style="text-decoration: none; margin-bottom: 10px; display: inline-block;">← Terug naar Home</a>
        <header class="header">
            <h1>SportScore - Score Invoer</h1>
            <button id="qr-toggle" onclick="toggleQR()" class="control-btn" style="float: right;">📱 QR</button>
            <div class="session-info">
                <span id="session-name">Sessie laden...</span>
                <span id="round-info">Ronde 1/1</span>
                <span id="timer">--:--</span>
            </div>
        </header>

        <main class="main-content">
            <div class="leaderboard-section">
                <h2>Scorebord</h2>
                <div class="leaderboard" id="leaderboard">
                    <!-- Leaderboard will be populated by JavaScript -->
                </div>
            </div>

            <div class="score-input-section">
                <h2>Score Aanpassen</h2>

                <div class="score-form">
                    <div class="form-group">
                        <label for="team-select">Selecteer Team:</label>
                        <select id="team-select">
                            <option value="">Kies een team...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="player-select">Selecteer Speler (optioneel):</label>
                        <select id="player-select">
                            <option value="">Heel team / geen specifieke speler</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="points-input">Punten:</label>
                        <div class="points-controls">
                            <button id="subtract-btn" type="button" class="points-btn subtract">-</button>
                            <input type="number" id="points-input" value="1" min="1" max="100">
                            <button id="add-btn" type="button" class="points-btn add">+</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reason-input">Reden (optioneel):</label>
                        <input type="text" id="reason-input" placeholder="bijv. Quiz vraag correct, Bonus punten..." maxlength="200">
                    </div>

                    <button id="submit-score-btn" type="button" class="submit-btn">Score Toevoegen</button>
                </div>

                <div class="quick-actions">
                    <h3>Snelle Acties</h3>
                    <div class="custom-quick-actions" id="custom-quick-actions">
                        <!-- Custom quick actions will be loaded here -->
                    </div>

                    <div class="quick-buttons" id="sport-quick-buttons">
                        <!-- Sport-specific buttons will be added here by JavaScript -->
                    </div>

                    <div class="create-quick-action">
                        <h4>Maak Snelle Actie</h4>
                        <div class="create-form">
                            <input type="text" id="custom-reason" placeholder="Reden (bijv. 3 Pointer)" maxlength="50">
                            <input type="number" id="custom-points" placeholder="Punten" min="-100" max="100">
                            <button id="add-custom-action" type="button" class="add-custom-btn">Toevoegen</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="recent-scores-section">
                <h2>Recente Scores</h2>
                <div class="recent-scores" id="recent-scores">
                    <!-- Recent scores will be populated by JavaScript -->
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="session-controls">
                <button id="pause-session-btn" type="button" class="control-btn pause">Pauze</button>
                <button id="next-round-btn" type="button" class="control-btn next">Volgende Ronde</button>
                <button id="end-session-btn" type="button" class="control-btn end">Sessie Beëindigen</button>
            </div>
        </footer>
    </div>

    <!-- Score Animation Overlay -->
    <div class="score-animation" id="score-animation">
        <div class="animation-content">
            <div class="team-icon" id="anim-team-icon">👥</div>
            <div class="score-change" id="anim-score-change">+5</div>
            <div class="team-name" id="anim-team-name">Team Naam</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dark_mode_toggle.js"></script>
    <script src="js/simple-scoreinput.js"></script>
    <script>
        const socket = io('http://' + window.location.hostname + ':8000');

        // Emit admin present when page loads
        socket.emit('admin-present');

        // Emit admin leave when page unloads
        window.addEventListener('beforeunload', () => {
            socket.emit('admin-leave');
        });

        // Function to toggle QR visibility
        function toggleQR() {
            socket.emit('toggle-qr');
        }
    </script>
</body>
</html>
