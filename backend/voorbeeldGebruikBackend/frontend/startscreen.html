<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Nieuwe Sessie</title>
    <link rel="stylesheet" href="css/startscreen.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        .main-content {
            display: flex;
            justify-content: center;
        }
        .right-column {
            max-width: 800px;
        }
        .control-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(108, 117, 125, 0.2);
        }
        .control-btn:hover {
            background: linear-gradient(135deg, #5a6268 0%, #495057 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(108, 117, 125, 0.3);
        }
        .power-user-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            opacity: 0.5;
            background: none;
            border: none;
            cursor: pointer;
        }
        .power-user-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="homescreen.html" class="control-btn" style="text-decoration: none;">← Terug naar Home</a>
                <div>
                    <h1>🧩 SportScore</h1>
                    <p>Digitaal scorebord voor teambuildings</p>
                </div>
                <div></div> <!-- Spacer -->
            </div>
        </header>

        <main class="main-content">
            <div class="right-column">
                <div class="active-session hidden" id="active-session">
                    <h2>Actieve Sessie</h2>
                    <div id="active-session-info"></div>
                    <div class="session-actions">
                        <button id="continue-session" class="continue-btn">Doorgaan met Sessie</button>
                        <button id="end-session" class="delete-team-btn">Sessie Beëindigen</button>
                    </div>
                </div>

                <div class="team-management" id="team-management">
                    <div class="section-header">
                        <h2>Team Beheer</h2>
                        <button id="add-team-btn" class="add-team-btn">+ Nieuw Team</button>
                    </div>
                    
                    <div id="team-form-container" class="team-form-container hidden">
                        <form id="team-form" class="team-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="team-name">Team Naam:</label>
                                    <input type="text" id="team-name" placeholder="bijv. Team Blauw" required>
                                </div>
                                <div class="form-group">
                                    <label for="team-color">Kleur:</label>
                                    <input type="color" id="team-color" value="#3B82F6" style="position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;">
                                    <div id="color-preview" class="color-preview">#3B82F6</div>
                                </div>
                            </div>
                            
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="team-icon">Icoon:</label>
                                    <select id="team-icon">
                                        <option value="team">👥 Team</option>
                                        <option value="star">⭐ Ster</option>
                                        <option value="trophy">🏆 Trofee</option>
                                        <option value="fire">🔥 Vuur</option>
                                        <option value="rocket">🚀 Raket</option>
                                        <option value="crown">👑 Kroon</option>
                                        <option value="lightning">⚡ Bliksem</option>
                                        <option value="heart">❤️ Hart</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="team-description">Beschrijving (optioneel):</label>
                                    <input type="text" id="team-description" placeholder="bijv. De beste spelers">
                                </div>
                            </div>
                            
                            <div class="form-actions">
                                <button type="submit" class="save-team-btn">Team Opslaan</button>
                                <button type="button" id="cancel-team-btn" class="cancel-team-btn">Annuleren</button>
                            </div>
                        </form>
                    </div>
                    
                    <div id="teams-list" class="teams-list">Laden...</div>
                </div>

                <div class="player-management" id="player-management">
                    <div class="section-header">
                        <h2>Speler Beheer</h2>
                        <button id="show-player-manager" class="view-all-btn">Open Speler Manager</button>
                    </div>
                    <div id="player-manager" style="display:none;">
                        <div class="player-manager-input-row">
                            <input class="input player-manager-input" type="text" id="pm-player-name" placeholder="Speler naam">
                            <!-- position input removed; positions are set alphabetically on creation -->
                            <button id="pm-add-player" class="save-team-btn">Toevoegen</button>
                        </div>
                        <div id="pm-players-list">Laden spelers…</div>
                    </div>
                </div>

                <div class="recent-sessions hidden" id="recent-sessions">
                    <div class="section-header">
                        <h2>Recente Sessies</h2>
                        <button id="view-all-sessions-btn" class="view-all-btn">Alle Sessies Bekijken</button>
                    </div>
                    <div id="sessions-list">Laden...</div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2025 SportScore - Digitaal Scorebord voor Teambuildings</p>
        </footer>
    </div>

    <button id="power-user-btn" class="power-user-link" title="Power User Mode">⚙️</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dark_mode_toggle.js"></script>
    <script src="js/startscreen.js"></script>
</body>
</html>
