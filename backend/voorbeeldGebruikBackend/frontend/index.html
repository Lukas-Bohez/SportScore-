<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamScore - Live Scorebord</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="sport-name">TeamScore</h1>
            <div id="scoring-mode-badge" class="scoring-mode-badge" style="display: none;">
                <span id="scoring-mode-text"></span>
            </div>
        </header>

        <main class="main-content">
            <div class="leaderboard-container" id="teams-container">
                <!-- Teams will be dynamically generated by JavaScript -->
            </div>
        </main>

        <footer class="footer">
            <div class="last-update" id="last-update">Laatste update: --:--:--</div>
            <div class="admin-link">
                <a href="startscreen.html">Beheer</a>
            </div>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/bigscreen.js"></script>
</body>
</html>
