<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Homepage</title>
    <link rel="stylesheet" href="css/startscreen.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        body {
            /* Removed padding-bottom so nav appears on top of content */
        }
        .content-section {
            display: none;
            padding: 20px;
            min-height: calc(100vh - 200px);
        }
        .content-section.active {
            display: block;
        }
        .hero {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 20px;
        }
        .hero h2 {
            font-size: 2.5em;
            margin: 0 0 20px;
            color: var(--text-color);
        }
        .hero p {
            font-size: 1.2em;
            margin: 0 0 30px;
            color: var(--text-secondary, #666);
        }
        .hero .btn {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .hero .btn:hover {
            background: linear-gradient(135deg, #0056b3 0%, #004085 100%);
            transform: translateY(-2px);
        }
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .template-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: transform 0.3s ease;
        }
        .template-card:hover {
            transform: translateY(-2px);
        }
        .template-card h3 {
            color: var(--text-color);
            margin-bottom: 10px;
        }
        .template-card p {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }
        .template-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .manage-teams {
            text-align: center;
            padding: 40px 20px;
        }
        .manage-teams .team-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        .sessions-view {
            max-width: 800px;
            margin: 0 auto;
        }
        .sessions-view h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 1.8em;
        }
        .view-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        .view-toggle button {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .view-toggle button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .sessions-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        .session-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: transform 0.3s ease;
        }
        .session-item:hover {
            transform: translateY(-2px);
        }
        .session-item h4 {
            color: var(--text-color);
            margin-bottom: 10px;
        }
        .session-item .details {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        .session-item .players {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .session-item .players div {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }
        .session-item .btn {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 14px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 8px var(--shadow-color);
            z-index: 1000; /* Ensure it appears on top of content */
        }
        @media (min-width: 768px) {
            .bottom-nav {
                justify-content: center;
                gap: 40px;
                padding: 15px 0;
            }
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        .nav-item:hover, .nav-item.active {
            border: 2px solid #000; /* Black border for active/hover state */
        }
        .nav-item .icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        .nav-item .label {
            font-size: 0.8em;
            color: var(--text-color);
        }
        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }
            .sessions-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>SportScore</h1>
            <p>Digitaal scorebord voor teambuildings</p>
        </header>

        <main>
            <!-- Start Session Section -->
            <div id="start-section" class="content-section active">
                <div class="hero">
                    <h2>Start Nieuwe Sessie</h2>
                    <p>Kies een template om snel te beginnen, of maak een custom sessie.</p>
                    <a href="simple-setup.html" class="btn">Sessie Starten</a>
                </div>
                <div class="templates-grid" id="templates-grid">
                    <!-- Templates will be loaded here -->
                </div>
            </div>

            <!-- Manage Teams Section -->
            <div id="teams-section" class="content-section">
                <div class="manage-teams">
                    <div class="team-icon">👥</div>
                    <h2>Teams Beheren</h2>
                    <p>Beheer bestaande teams en spelers.</p>
                    <a href="startscreen.html" class="btn">Naar Team Beheer</a>
                </div>
            </div>

            <!-- Old Sessions Section -->
            <div id="sessions-section" class="content-section">
                <div class="sessions-view">
                    <h2>Oude Sessies</h2>
                    <div class="view-toggle">
                        <button id="simple-view" class="active">Eenvoudig</button>
                        <button id="detailed-view">Gedetailleerd</button>
                    </div>
                    <div class="sessions-list" id="sessions-list">
                        <!-- Sessions will be loaded here -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item" data-section="teams">
                <div class="icon">👥</div>
                <div class="label">Teams</div>
            </div>
            <div class="nav-item active" data-section="start">
                <div class="icon">🚀</div>
                <div class="label">Start</div>
            </div>
            <div class="nav-item" data-section="sessions">
                <div class="icon">🕐</div>
                <div class="label">Sessies</div>
            </div>
        </nav>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dark_mode_toggle.js"></script>
    <script src="js/homepage.js"></script>
</body>
</html>
