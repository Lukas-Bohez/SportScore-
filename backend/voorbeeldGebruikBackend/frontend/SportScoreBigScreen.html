<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Live Scorebord</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="http://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="sport-name">SportScore</h1>
        </header>

        <main class="main-content">
            <div class="leaderboard-container" id="teams-container">
                <!-- Teams will be dynamically generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- QR Code Overlay -->
    <div id="qr-overlay" class="qr-overlay">
        <div class="qr-container">
            <h2>Connect to WiFi</h2>
            <div id="qrcode"></div>
            <p>Scan to connect to PiHotspot</p>
            <p>Password: raspberry</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dark_mode_toggle.js"></script>
    <script src="js/bigscreen.js"></script>
    <script>
        // Auto-detect backend base URL (same as api.js)
        const fromGlobal = typeof window !== 'undefined' && window.SCOREBOARD_API_BASE;
        const fromQuery = typeof window !== 'undefined' ? new URLSearchParams(window.location.search).get('apiBase') : null;
        const detected = fromGlobal || fromQuery;
        const backendURL = detected || 'http://192.168.123.241:8000'; // Default to known backend IP

        const socket = io(backendURL);
        let qrVisible = true;

        // Generate QR code for WiFi
        const wifiString = 'WIFI:S:PiHotspot;T:WPA;P:raspberry;;';
        try {
            new QRCode(document.getElementById('qrcode'), {
                text: wifiString,
                width: 256,
                height: 256
            });
        } catch (e) {
            console.error('QRCode generation failed:', e);
            document.getElementById('qrcode').innerHTML = '<p>QR Code: ' + wifiString + '</p>';
        }

        // Initially show QR
        showQR();

        socket.on('show-qr', () => {
            qrVisible = true;
            showQR();
        });

        socket.on('toggle-qr', (data) => {
            if (typeof data === 'boolean') {
                qrVisible = data;
            } else {
                qrVisible = !qrVisible;
            }
            if (qrVisible) {
                showQR();
            } else {
                hideQR();
            }
        });

        function showQR() {
            document.getElementById('qr-overlay').style.display = 'flex';
        }

        function hideQR() {
            document.getElementById('qr-overlay').style.display = 'none';
        }
    </script>
        if (adminCount === 0) {
            showQR();
        }
    </script>
    <style>
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .qr-container h2 {
            margin-bottom: 20px;
        }
        .qr-container p {
            margin: 10px 0;
        }
    </style>
</body>
</html>
