<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Live Scorebord</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 id="sport-name">SportScore</h1>
        </header>

        <main class="main-content">
            <div class="leaderboard-container" id="teams-container">
                <!-- Teams will be dynamically generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- QR Code Overlay -->
    <div id="qr-overlay" class="qr-overlay">
        <div class="qr-container">
            <h2>Connect to WiFi</h2>
            <div id="qrcode"></div>
            <p>Scan to connect to PiHotspot</p>
            <p>Password: raspberry</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dark_mode_toggle.js"></script>
    <script src="js/bigscreen.js"></script>
    <script>
        const socket = io('http://' + window.location.hostname + ':8000');
        let adminPresent = false;
        let qrVisible = true;

        // Generate QR code for WiFi
        const wifiString = 'WIFI:S:PiHotspot;T:WPA;P:raspberry;;';
        QRCode.toCanvas(document.getElementById('qrcode'), wifiString, { width: 256 }, function (error) {
            if (error) console.error(error);
        });

        // Initially show QR
        showQR();

        socket.on('hide-qr', () => {
            adminPresent = true;
            hideQR();
        });

        socket.on('show-qr', () => {
            adminPresent = false;
            if (qrVisible) {
                showQR();
            }
        });

        socket.on('toggle-qr', (data) => {
            if (typeof data === 'boolean') {
                qrVisible = data;
            } else {
                qrVisible = !qrVisible;
            }
            if (qrVisible && !adminPresent) {
                showQR();
            } else {
                hideQR();
            }
        });

        function showQR() {
            document.getElementById('qr-overlay').style.display = 'flex';
        }

        function hideQR() {
            document.getElementById('qr-overlay').style.display = 'none';
        }
    </script>

            showQR();
        }
    </script>
    <style>
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .qr-container h2 {
            margin-bottom: 20px;
        }
        .qr-container p {
            margin: 10px 0;
        }
    </style>
</body>
</html>
