<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Live Scorebord</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <script src="http://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 id="sport-name">SportScore</h1>
        </header>

        <main class="main-content">
            <div class="leaderboard-container" id="teams-container">
                <!-- Teams will be dynamically generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- QR Code Overlay -->
    <div id="qr-overlay" class="qr-overlay">
        <div class="qr-container">
            <h2>Connect to WiFi</h2>
            <div id="qrcode"></div>
            <p>Scan to connect to PiHotspot</p>
            <p>Password: raspberry</p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/bigscreen.js"></script>
    <script>
        // Wait for API to initialize socket, then set up logging
        document.addEventListener('DOMContentLoaded', () => {
            const socket = api.socket;
            if (socket) {
                console.log('BigScreen: Using global API socket, connecting to:', api.baseURL);
                socket.on('connect', () => {
                    console.log('BigScreen: Socket connected');
                });
                socket.on('disconnect', () => {
                    console.log('BigScreen: Socket disconnected');
                });
                socket.on('connect_error', (error) => {
                    console.error('BigScreen: Socket connection error:', error);
                });

                // Socket is already connected if already available
                if (socket.connected) {
                    console.log('BigScreen: Socket already connected');
                }
            } else {
                console.error('BigScreen: No socket available from API');
            }
        });

        // Generate QR code for WiFi
        const wifiString = 'WIFI:S:PiHotspot;T:WPA;P:raspberry;;';
        try {
            new QRCode(document.getElementById('qrcode'), {
                text: wifiString,
                width: 256,
                height: 256
            });
        } catch (e) {
            console.error('QRCode generation failed:', e);
            document.getElementById('qrcode').innerHTML = '<p>QR Code: ' + wifiString + '</p>';
        }

        // QR functionality is handled by BigScreenDisplay class in bigscreen.js
    </script>
    </script>
    <style>
        .qr-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .qr-container h2 {
            margin-bottom: 20px;
        }

        .qr-container p {
            margin: 10px 0;
        }
    </style>
</body>

</html>
