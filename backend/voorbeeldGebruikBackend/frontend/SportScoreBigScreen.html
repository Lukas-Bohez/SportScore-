<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportScore - Live Scorebord</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 id="sport-name">SportScore</h1>
            <div class="session-info"
                style="display: flex; gap: 20px; justify-content: center; align-items: center; margin-top: 10px;">
                <span id="round-info" style="font-size: 1.3em; font-weight: 600; display: none;">Ronde 1/1</span>
                <span id="timer" style="font-size: 1.5em; font-weight: 700; color: #10b981; display: none;">--:--</span>
            </div>
        </header>

        <main class="main-content">
            <div class="leaderboard-container" id="teams-container">
                <!-- Teams will be dynamically generated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- QR Code Overlay -->
    <div id="qr-overlay" class="qr-overlay">
        <div class="qr-container">
            <div class="qr-row">
                <div class="qr-item">
                    <h2>Connect to WiFi</h2>
                    <img id="qrcode-wifi" src="png/wifi_qr.png" alt="WiFi QR Code" width="256" height="256">
                    <p>Scan to connect to PiHotspot</p>
                    <p>Password: raspberry</p>
                </div>
                <div class="qr-item">
                    <h2>Open Admin Panel</h2>
                    <img id="qrcode-admin" src="png/admin_qr.png" alt="Admin QR Code" width="256" height="256">
                    <p>Scan to access SportScore admin</p>
                    <p id="admin-url" style="font-size: 0.9em; color: #666;">http://10.42.0.1</p>
                </div>
            </div>
            <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
            <script src="js/api.js"></script>
            <script src="js/shared-utils.js"></script>
            <script src="js/bigscreen.js"></script>
            <script>
                // Wait for API to initialize socket, then set up logging
                document.addEventListener('DOMContentLoaded', () => {
                    const socket = api.socket;
                    if (socket) {
                        console.log('BigScreen: Using global API socket, connecting to:', api.baseURL);
                        socket.on('connect', () => {
                            console.log('BigScreen: Socket connected');
                        });
                        socket.on('disconnect', () => {
                            console.log('BigScreen: Socket disconnected');
                        });
                        socket.on('connect_error', (error) => {
                            console.error('BigScreen: Socket connection error:', error);
                        });

                        // Socket is already connected if already available
                        if (socket.connected) {
                            console.log('BigScreen: Socket already connected');
                        }
                    } else {
                        console.error('BigScreen: No socket available from API');
                    }
                });

                // QR functionality is handled by BigScreenDisplay class in bigscreen.js
            </script>
            </script>
            <style>
                .qr-overlay {
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    backdrop-filter: blur(10px);
                    display: none;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                }

                .qr-container {
                    background: white;
                    padding: 20px;
                    border-radius: 10px;
                    text-align: center;
                    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
                    max-width: 92vw;
                    /* ensure it never extends beyond viewport width */
                    box-sizing: border-box;
                    overflow: hidden;
                }

                /* New layout: place QR codes side-by-side and center them */
                .qr-row {
                    display: flex;
                    justify-content: center;
                    align-items: flex-start;
                    gap: 40px;
                    flex-wrap: wrap;
                    margin-top: 8px;
                }

                .qr-item {
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                    width: 320px;
                    max-width: 45vw;
                }

                #qrcode-wifi,
                #qrcode-admin {
                    width: 256px;
                    height: 256px;
                    display: block;
                    margin: 0 auto 8px;
                }

                .qr-container h2 {
                    margin-bottom: 12px;
                }

                .qr-container p {
                    margin: 6px 0;
                }

                @media (max-width: 640px) {
                    .qr-row {
                        flex-direction: column;
                        gap: 20px;
                    }

                    .qr-item {
                        width: 92vw;
                        max-width: 92vw;
                    }

                    #qrcode-wifi,
                    #qrcode-admin {
                        width: min(60vw, 256px);
                        height: auto;
                    }
                }
            </style>
            <style>
                /* Use standard system fonts for consistent rendering */
                body,
                .team-icon,
                .participant-medal,
                .participant-total,
                .player-badge-bigscreen {
                    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                    -webkit-font-smoothing: antialiased;
                    -moz-osx-font-smoothing: grayscale;
                }

                /* Remove excessive spacing and ensure clean typography for BigScreen */
                body,
                .container,
                .header,
                .team,
                .leaderboard-container,
                .leaderboard-team,
                .team-name,
                .team-position,
                .team-score,
                .participant-name,
                .participant-total,
                .player-badge-bigscreen,
                .qr-container,
                .qr-item {
                    letter-spacing: normal !important;
                    word-spacing: normal !important;
                }

                /* Reduce header tracking for improved appearance on the bigscreen */
                .header h1 {
                    letter-spacing: 1px !important;
                }

                /* Ensure QR items are centered nicely */
                .qr-container .qr-row {
                    justify-content: center;
                }
            </style>
</body>

</html>
